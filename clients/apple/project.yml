name: Analytico
options:
  bundleIdPrefix: ru.plosca
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: JVVN972Y79
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  AnalyticoKit:
    path: Packages/AnalyticoKit
targets:
  Analytico:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
      - path: Intents
    dependencies:
      - package: AnalyticoKit
      - target: AnalyticoWidgets
      - target: AnalyticoNotifications
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Analytico
        CFBundleURLTypes:
          - CFBundleURLName: ru.plosca.analytico
            CFBundleURLSchemes: [analytico]
        UIAppFonts: [Quando-Regular.ttf]
        ATSApplicationFontsPath: .
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        LSApplicationCategoryType: public.app-category.business
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        # Push is `aps-environment` on iOS and a developer key on macOS;
        # export switches both to production.
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: App/Analytico-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: App/Analytico-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: App/Analytico-macOS.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: ru.plosca.analytico
        PRODUCT_NAME: Analytico
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  AnalyticoWidgets:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Widgets
      - path: Intents
      - path: App/Resources
    dependencies:
      - package: AnalyticoKit
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Analytico
        UIAppFonts: [Quando-Regular.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/AnalyticoWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [group.ru.plosca.analytico]
        keychain-access-groups: [$(AppIdentifierPrefix)ru.plosca.analytico]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.plosca.analytico.widgets
        PRODUCT_NAME: AnalyticoWidgets
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  AnalyticoNotifications:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Notifications
    dependencies:
      - package: AnalyticoKit
    info:
      path: Notifications/Info.plist
      properties:
        CFBundleDisplayName: Analytico
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: Notifications/AnalyticoNotifications.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [group.ru.plosca.analytico]
        keychain-access-groups: [$(AppIdentifierPrefix)ru.plosca.analytico]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.plosca.analytico.notifications
        PRODUCT_NAME: AnalyticoNotifications
schemes:
  Analytico:
    build:
      targets:
        Analytico: all
    test:
      targets: []
